# Render Blueprint. After changing this file, open the Blueprint in Render and click "Sync"
# (or enable auto-sync) so database and environment changes are applied to the service.
databases:
  - name: encore-db
    databaseName: encore
    user: encore
    # Free Render Postgres databases expire after 30 days. Switch to a paid plan (e.g. basic-256mb) to keep data.
    plan: free

services:
  - type: web
    name: encore
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free            # all data and uploaded photos are stored in PostgreSQL, so no disk is needed
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: encore-db
          property: connectionString
      - key: ENCORE_ENV
        value: production
      - key: ENCORE_SINGLE_PORT     # guest app at /, organizer admin at /admin
        value: "1"
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY            # Render's proxy sets X-Forwarded-For
        value: "1"
      - key: ENCORE_SECRET
        generateValue: true
      # DEMO MODE: guest sign-in codes are shown on screen (no SMS) and online checkout simulates a
      # successful payment (no money moves). Set to "0" before real guests or real sales.
      - key: ENCORE_DEMO
        value: "1"
