# Render Blueprint. After changing this file, open the Blueprint in Render and click "Sync"
# (or enable auto-sync) so database and environment changes are applied to the service.
databases:
  - name: encore-db
    databaseName: encore
    user: encore
    # Free Render Postgres databases expire after 30 days. Switch to a paid plan (e.g. basic-256mb) to keep data.
    plan: free

services:
  - type: web
    name: encore
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free            # all data and uploaded photos are stored in PostgreSQL, so no disk is needed
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: encore-db
          property: connectionString
      - key: ENCORE_ENV
        value: production
      - key: ENCORE_SINGLE_PORT     # guest app at /, organizer admin at /admin
        value: "1"
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY            # Render's proxy sets X-Forwarded-For
        value: "1"
      - key: ENCORE_SECRET
        generateValue: true
      # PLATFORM CONSOLE (/admin/platform) for Encore operators. Set both values in the Render dashboard
      # (never commit them). The account is created or its password updated on each start. 12+ characters.
      - key: ENCORE_PLATFORM_EMAIL
        sync: false
      - key: ENCORE_PLATFORM_PASSWORD
        sync: false
      # GUEST SIGN-IN: set the provider and its credentials in the Render dashboard (never in this file).
      # twilio | africastalking | afromessage | geezsms | http — see README. Until these are set, guests cannot sign in.
      - key: SMS_PROVIDER
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
